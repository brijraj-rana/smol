name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install optional encoders
        run: brew install webp jpeg-xl
      - name: Build
        run: swift build
      - name: Test
        run: swift test
